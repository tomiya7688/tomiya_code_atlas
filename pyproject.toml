[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tomiya-code-atlas"
version = "0.1.0"
description = "Source code analysis, visualization, and design evaluation toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "tomiya7688" }
]
dependencies = [
    "PyYAML>=6.0",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-gdscript>=6.1,<7",
]

[project.optional-dependencies]
test = ["pytest>=8"]
exe = ["pyinstaller>=6"]

[project.scripts]
tomiya-code-atlas = "app:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["Src*"]
