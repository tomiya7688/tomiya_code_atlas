[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tomiya-code-atlas"
dynamic = ["version"]
description = "Source code analysis, visualization, and design evaluation toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "tomiya7688" }
]
dependencies = [
    "PyYAML>=6.0",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-gdscript==6.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
parser-build = ["PyInstaller>=6.10,<7"]
cpp-parser = ["libclang-ng==22.1.4.2; python_version >= '3.12'"]

[project.scripts]
tomiya-code-atlas = "app:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.dynamic]
version = {attr = "Src.version.__version__"}

[tool.setuptools.packages.find]
include = ["Src*"]
