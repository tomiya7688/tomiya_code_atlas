[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tomiya-code-atlas-python-reference"
dynamic = ["version"]
description = "Python reference implementation and parser-helper build tooling for Tomiya Code Atlas."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "tomiya7688" }
]
dependencies = [
    "PyYAML>=6.0",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-gdscript==6.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
parser-build = ["PyInstaller>=6.10,<7"]
cpp-parser = ["libclang-ng==22.1.4.2; python_version >= '3.12'"]
format = ["ruff==0.15.22"]

[project.scripts]
tomiya-code-atlas-python = "Src.app:main"

[tool.setuptools.dynamic]
version = {attr = "Src.version.__version__"}

[tool.ruff]
target-version = "py311"

[tool.setuptools.packages.find]
include = ["Src*"]
