name: .NET

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Directory.Build.props"
      - "KadokaCodeAtlas.sln"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore KadokaCodeAtlas.sln

      - name: Build
        run: dotnet build KadokaCodeAtlas.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test KadokaCodeAtlas.sln --no-build --configuration Release
