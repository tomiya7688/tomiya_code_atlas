name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: Pythonを準備
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: projectとtest用ツールをinstall
        run: |
          mkdir -p .build/metadata
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Goを準備
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"

      - name: Go parser helperをbuild
        working-directory: backends/go
        run: go build -o tomiya-go-backend .

      - name: Go Common IR conformance test
        working-directory: go
        run: go test ./...

      - name: Python sourceをcompile
        run: python -m compileall -q app.py Src tools tests

      - name: 全testを実行
        run: python -m pytest

      - name: 最新のUPD Commander Checkerをinstall
        run: python -m pip install -r tools/requirements-upd.txt

      - name: UPD Commander policyを確認
        run: upd-commander-check .

      - name: architecture policyを確認
        run: python tools/context_tool.py policy-check

      - name: 起動smoke test
        run: python app.py --version

      - name: 自己解析smoke summary
        if: matrix.python-version == '3.12'
        run: python tools/self_analysis.py . > self-analysis-summary.json

      - name: context indexと範囲指定検索のsmoke test
        if: matrix.python-version == '3.12'
        run: |
          python tools/context_tool.py profile > /tmp/kca-profile.json
          python tools/context_tool.py structure-index > /tmp/kca-structure.json
          python tools/context_tool.py doc-index > /tmp/kca-doc-index.json
          python tools/context_tool.py role-map > /tmp/kca-role-map.json
          python tools/context_tool.py truth-candidates > /tmp/kca-truth.json
          python tools/context_tool.py search "Common IR" --max-results 5 > /tmp/kca-search.json
          python tools/context_tool.py path-find "*.py" --max-results 5 > /tmp/kca-paths.json


  csharp-backend:
    name: C# Roslyn backend
    runs-on: ubuntu-latest

    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: .NET 10を準備
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pythonを準備
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Roslyn helperをbuild
        run: dotnet build backend-src/csharp/Tomiya.CSharp.Backend.csproj -c Release

      - name: Roslyn conformance smoke test
        run: python tools/csharp_backend_smoke.py dotnet backend-src/csharp/bin/Release/net10.0/tomiya-csharp-backend.dll

  java-backend:
    name: JavaParser Symbol Solver backend
    runs-on: ubuntu-latest

    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: Java 25を準備
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Pythonを準備
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: JavaParser helperをbuild
        run: mvn -q -f backend-src/java/pom.xml package

      - name: JavaParser conformance smoke test
        run: python tools/java_backend_smoke.py java -jar backend-src/java/target/tomiya-java-backend.jar

  oop-design:
    name: OOP設計policy
    runs-on: ubuntu-latest

    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: 製品C# sourceを検出
        id: csharp
        shell: bash
        run: |
          if find . -type f -name '*.cs' \
            -not -path './.git/*' \
            -not -path './.dev/*' \
            -not -path './build/*' \
            -not -path './dist/*' \
            -not -path './.build/*' \
            -not -path './tests/*' \
            -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::製品C# sourceがないため、OOP Design CheckerはCI gateとして導入済みです。C# sourceが追加されると実行します。"
          fi

      - name: .NET 10を準備
        if: steps.csharp.outputs.present == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 最新のOOP Design Checkerを取得
        if: steps.csharp.outputs.present == 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch main https://github.com/tomiya7688/oop-design-checker.git "$RUNNER_TEMP/oop-design-checker"
          echo "Using oop-design-checker $(git -C "$RUNNER_TEMP/oop-design-checker" rev-parse HEAD)"

      - name: OOP設計policyを確認
        if: steps.csharp.outputs.present == 'true'
        shell: bash
        run: |
          mapfile -t projects < <(
            find . -type f -name '*.csproj' \
              -not -path './.git/*' \
              -not -path './.dev/*' \
              -not -path './build/*' \
              -not -path './dist/*' \
              -not -path './.build/*' \
              -not -path './tests/*' \
              | sort
          )
          if [ "${#projects[@]}" -gt 0 ]; then
            for project in "${projects[@]}"; do
              echo "Restoring $project for OOP design analysis"
              dotnet restore "$project"
              echo "Checking OOP design for $project"
              dotnet run \
                --project "$RUNNER_TEMP/oop-design-checker/tools/oop-design-checker/src/frontends/cui/OopDesignChecker.Cui.csproj" \
                -- "$project" \
                --config "$GITHUB_WORKSPACE/oop-design-checker.json" \
                --fail-on danger \
                --format github
            done
          else
            dotnet run \
              --project "$RUNNER_TEMP/oop-design-checker/tools/oop-design-checker/src/frontends/cui/OopDesignChecker.Cui.csproj" \
              -- . \
              --config "$GITHUB_WORKSPACE/oop-design-checker.json" \
              --fail-on danger \
              --format github
          fi


