name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"

      - name: Build Go parser helper
        working-directory: backends/go
        run: go build -o kadoka-go-backend .

      - name: Compile Python sources
        run: python -m compileall -q app.py Src tools tests

      - name: Run full test suite
        run: python -m pytest

      - name: Install latest UPD Commander Checker
        run: python -m pip install -r tools/requirements-upd.txt

      - name: Check UPD Commander policy
        run: upd-commander-check .

      - name: Check architecture policy
        run: python tools/context_tool.py policy-check

      - name: Launch smoke test
        run: python app.py --version

      - name: Self-analysis smoke summary
        if: matrix.python-version == '3.12'
        run: python tools/self_analysis.py . > self-analysis-summary.json

      - name: Smoke context indexes and bounded discovery
        if: matrix.python-version == '3.12'
        run: |
          python tools/context_tool.py profile > /tmp/kca-profile.json
          python tools/context_tool.py structure-index > /tmp/kca-structure.json
          python tools/context_tool.py doc-index > /tmp/kca-doc-index.json
          python tools/context_tool.py role-map > /tmp/kca-role-map.json
          python tools/context_tool.py truth-candidates > /tmp/kca-truth.json
          python tools/context_tool.py search "Common IR" --max-results 5 > /tmp/kca-search.json
          python tools/context_tool.py path-find "*.py" --max-results 5 > /tmp/kca-paths.json


  csharp-backend:
    name: C# Roslyn backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build Roslyn helper
        run: dotnet build backend-src/csharp/Kadoka.CSharp.Backend.csproj -c Release

      - name: Run Roslyn conformance smoke
        run: python tools/csharp_backend_smoke.py dotnet backend-src/csharp/bin/Release/net10.0/kadoka-csharp-backend.dll

  java-backend:
    name: JavaParser Symbol Solver backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build JavaParser helper
        run: mvn -q -f backend-src/java/pom.xml package

      - name: Run JavaParser conformance smoke
        run: python tools/java_backend_smoke.py java -jar backend-src/java/target/kadoka-java-backend.jar

  oop-design:
    name: OOP design policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect C# product sources
        id: csharp
        shell: bash
        run: |
          if find . -type f -name '*.cs' \
            -not -path './.git/*' \
            -not -path './.dev/*' \
            -not -path './build/*' \
            -not -path './dist/*' \
            -not -path './tests/*' \
            -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No C# product sources found; OOP Design Checker is installed as a CI gate and will run when C# sources are present."
          fi

      - name: Set up .NET 10
        if: steps.csharp.outputs.present == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Fetch latest OOP Design Checker
        if: steps.csharp.outputs.present == 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch main https://github.com/tomiya7688/oop-design-checker.git "$RUNNER_TEMP/oop-design-checker"
          echo "Using oop-design-checker $(git -C "$RUNNER_TEMP/oop-design-checker" rev-parse HEAD)"

      - name: Check OOP design policy
        if: steps.csharp.outputs.present == 'true'
        shell: bash
        run: |
          mapfile -t projects < <(
            find . -type f -name '*.csproj' \
              -not -path './.git/*' \
              -not -path './.dev/*' \
              -not -path './build/*' \
              -not -path './dist/*' \
              -not -path './tests/*' \
              | sort
          )
          if [ "${#projects[@]}" -gt 0 ]; then
            for project in "${projects[@]}"; do
              echo "Restoring $project for OOP design analysis"
              dotnet restore "$project"
              echo "Checking OOP design for $project"
              dotnet run \
                --project "$RUNNER_TEMP/oop-design-checker/src/frontends/cui/OopDesignChecker.Cui.csproj" \
                -- "$project" \
                --config "$GITHUB_WORKSPACE/oop-design-checker.json" \
                --fail-on danger \
                --format github
            done
          else
            dotnet run \
              --project "$RUNNER_TEMP/oop-design-checker/src/frontends/cui/OopDesignChecker.Cui.csproj" \
              -- . \
              --config "$GITHUB_WORKSPACE/oop-design-checker.json" \
              --fail-on danger \
              --format github
          fi


