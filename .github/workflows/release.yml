name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: Pythonを準備
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: .NET SDKを準備
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: JDKを準備
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: projectとrelease用buildツールをinstall
        shell: cmd
        run: call scripts\build\setup.bat

      - name: tagとpackage versionを照合
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (& python -c "from Src.version import __version__; print(__version__)").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "正本のpackage versionを取得できませんでした。"
          }
          if ($tag -ne "v$version") {
            throw "release tag $tag とpackage version $version が一致しません。"
          }

      - name: release候補をbuild・検証
        shell: cmd
        run: call scripts\build\verify.bat

      - name: 検証済みWindows配布物をarchive化
        shell: pwsh
        run: Compress-Archive -Path .build\dist\tomiya-code-atlas -DestinationPath .build\dist\tomiya-code-atlas-windows-x64.zip

      - name: 検証済みrelease artifactを公開
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            (Get-ChildItem .build\packages -File -Filter "tomiya_code_atlas-*.whl").FullName
            (Get-ChildItem .build\packages -File -Filter "tomiya_code_atlas-*.tar.gz").FullName
            (Get-Item .build\dist\tomiya-code-atlas-windows-x64.zip).FullName
          )
          if ($files.Count -ne 3 -or $files -contains $null) {
            throw "wheel、source archive、検証済みWindows app archiveがそれぞれ1つ必要です。"
          }
          gh release create $env:GITHUB_REF_NAME @files --verify-tag --generate-notes
