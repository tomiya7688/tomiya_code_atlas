name: Build

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Verify installed wheel artifact
        run: python tools/verify_wheel.py dist/*.whl

      - name: Verify installed source archive
        run: python tools/verify_wheel.py dist/*.tar.gz

      - name: Upload tested Python package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tomiya-code-atlas-python-package
          path: dist/*
          if-no-files-found: error