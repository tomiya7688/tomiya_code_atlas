name: Build

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: Pythonを準備
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: build用ツールをinstall
        run: python -m pip install --upgrade pip build

      - name: build用フォルダーを準備
        run: mkdir -p .build/metadata .build/packages

      - name: Python packageをbuild
        run: python -m build --outdir .build/packages

      - name: wheel artifactを検証
        run: python tools/verify_wheel.py .build/packages/*.whl

      - name: source archiveを検証
        run: python tools/verify_wheel.py .build/packages/*.tar.gz

      - name: 検証済みPython packageをartifactとして保存
        uses: actions/upload-artifact@v7
        with:
          name: tomiya-code-atlas-python-package
          path: .build/packages/*
          if-no-files-found: error
