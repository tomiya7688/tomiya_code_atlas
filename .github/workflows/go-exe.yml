name: Go EXE

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "go/**"
      - "parser-backends/go/**"
      - "parser-backends/python/**"
      - "parser-backends/cpp/**"
      - "parser-backends/java/**"
      - "parser-backends/licenses/javaparser-NOTICE.txt"
      - "Src/languages/java_backend.py"
      - "Src/languages/cpp_backend.py"
      - "Src/analyzers/ir.py"
      - "Src/languages/gdscript_backend.py"
      - "tests/test_gdscript_tree_sitter_backend.py"
      - "tests/fixtures/backend_conformance/gdscript.gd"
      - "parser-backends/csharp/**"
      - "parser-backends/licenses/**"
      - "pyproject.toml"
      - "parser-backends/manifest.json"
      - "tests/fixtures/static_specification/**"
      - "internal/**"
      - "scripts/build/build_go.bat"
      - "scripts/build/build_go_parser_backend.bat"
      - "scripts/build/build_python_backend.bat"
      - "scripts/build/build_csharp_backend.bat"
      - "scripts/build/build_cpp_backend.bat"
      - "scripts/build/build_java_backend.bat"
      - "scripts/build/smoke_python_backend.py"
      - "tools/cpp_backend_smoke.py"
      - "tools/java_backend_smoke.py"
      - "tools/go_backend_smoke.py"
      - "tools/go_cli_smoke.py"
      - "scripts/build/copy_python_runtime_license.py"
      - "scripts/build/setup.bat"
      - "build_exe.bat"
      - "run_dist.bat"
      - ".github/workflows/go-exe.yml"
      - "tests/test_windows_build_entrypoints.py"
      - "tests/test_go_artifact_contents.py"
      - "tests/test_python_parser_helper.py"
      - "tests/test_gdscript_tree_sitter_backend.py"
      - "tests/test_csharp_roslyn_backend.py"
      - "tests/test_cpp_clang_backend.py"
      - "tests/test_cpp_backend_selection.py"
      - "tests/test_java_javaparser_backend.py"
      - "tests/fixtures/backend_conformance/java.java"
      - "tools/csharp_backend_smoke.py"
      - "tests/fixtures/backend_conformance/csharp*"
      - "tests/fixtures/backend_conformance/cpp*"
      - "tests/fixtures/backend_conformance/support.hpp"
      - "tests/fixtures/backend-evaluations/cpp.json"
      - "Src/languages/python.py"
      - "Src/languages/python_backend.py"
      - "Src/languages/python_project.py"
      - "specification/architecture-policy.md"
      - "specification/parser-backend-contract.md"
  push:
    paths:
      - "go.mod"
      - "go.sum"
      - "go/**"
      - "parser-backends/go/**"
      - "parser-backends/python/**"
      - "parser-backends/cpp/**"
      - "parser-backends/java/**"
      - "parser-backends/licenses/javaparser-NOTICE.txt"
      - "Src/languages/java_backend.py"
      - "Src/languages/cpp_backend.py"
      - "Src/analyzers/ir.py"
      - "Src/languages/gdscript_backend.py"
      - "tests/test_gdscript_tree_sitter_backend.py"
      - "tests/fixtures/backend_conformance/gdscript.gd"
      - "parser-backends/csharp/**"
      - "parser-backends/licenses/**"
      - "pyproject.toml"
      - "parser-backends/manifest.json"
      - "tests/fixtures/static_specification/**"
      - "internal/**"
      - "scripts/build/build_go.bat"
      - "scripts/build/build_go_parser_backend.bat"
      - "scripts/build/build_python_backend.bat"
      - "scripts/build/build_csharp_backend.bat"
      - "scripts/build/build_cpp_backend.bat"
      - "scripts/build/build_java_backend.bat"
      - "scripts/build/smoke_python_backend.py"
      - "tools/cpp_backend_smoke.py"
      - "tools/java_backend_smoke.py"
      - "tools/go_backend_smoke.py"
      - "tools/go_cli_smoke.py"
      - "scripts/build/copy_python_runtime_license.py"
      - "scripts/build/setup.bat"
      - "build_exe.bat"
      - "run_dist.bat"
      - ".github/workflows/go-exe.yml"
      - "tests/test_windows_build_entrypoints.py"
      - "tests/test_go_artifact_contents.py"
      - "tests/test_python_parser_helper.py"
      - "tests/test_gdscript_tree_sitter_backend.py"
      - "tests/test_csharp_roslyn_backend.py"
      - "tests/test_cpp_clang_backend.py"
      - "tests/test_cpp_backend_selection.py"
      - "tests/test_java_javaparser_backend.py"
      - "tests/fixtures/backend_conformance/java.java"
      - "tools/csharp_backend_smoke.py"
      - "tests/fixtures/backend_conformance/csharp*"
      - "tests/fixtures/backend_conformance/cpp*"
      - "tests/fixtures/backend_conformance/support.hpp"
      - "tests/fixtures/backend-evaluations/cpp.json"
      - "Src/languages/python.py"
      - "Src/languages/python_backend.py"
      - "Src/languages/python_project.py"
      - "specification/architecture-policy.md"
      - "specification/parser-backend-contract.md"
      - "tests/fixtures/static_specification/**"
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: ソースを取得
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Goを準備
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: go/go.mod

      - name: .NET 10 SDKを準備
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Java 25 JDKを準備
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: PythonとPyInstallerを準備
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python parser helperのbuild依存を準備
        shell: cmd
        run: call scripts\build\setup.bat

      - name: Go testを実行
        working-directory: go
        run: go test ./...

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: GUI CSSのformat check
        run: |
          npm ci --prefix tools/web-format --ignore-scripts --no-audit --no-fund
          npm --prefix tools/web-format run check

      - name: GoとPythonのformat check
        shell: pwsh
        env:
          GO_FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $formatBase = $env:GO_FORMAT_BASE
          $formatRange = $null
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            if (-not $formatBase) {
              Write-Output "Pull request base SHA is missing."
              exit 1
            }
            $formatRange = "${formatBase}...HEAD"
          } elseif ($formatBase -and $formatBase -notmatch "^0+$") {
            $resolvedBase = git rev-parse --verify --quiet "${formatBase}^{commit}"
            if ($LASTEXITCODE -eq 0) {
              $formatRange = "${resolvedBase}..HEAD"
            }
          }
          if (-not $formatRange) {
            if (-not $env:GO_DEFAULT_BRANCH) {
              Write-Output "Default branch name is missing."
              exit 1
            }
            $defaultBranchRef = "refs/remotes/origin/$env:GO_DEFAULT_BRANCH"
            $resolvedDefaultBranch = git rev-parse --verify --quiet $defaultBranchRef
            if ($LASTEXITCODE -ne 0 -or -not $resolvedDefaultBranch) {
              Write-Output "Default branch ref $defaultBranchRef is unavailable."
              exit 1
            }
            $mergeBase = git merge-base HEAD $resolvedDefaultBranch
            $mergeBaseExitCode = $LASTEXITCODE
            if ($mergeBaseExitCode -ne 0 -or -not $mergeBase) {
              Write-Output "Unable to find a comparison base against $defaultBranchRef."
              exit 1
            }
            $formatRange = "${mergeBase}..HEAD"
          }
          $changedGoPaths = @(git diff --name-only $formatRange -- go/ parser-backends/go/)
          $gitDiffExitCode = $LASTEXITCODE
          if ($gitDiffExitCode -ne 0) {
            Write-Output "Unable to find changed Go sources (git diff exit code $gitDiffExitCode)."
            exit $gitDiffExitCode
          }
          $goSourceFiles = @(
            $changedGoPaths |
              Where-Object { $_.EndsWith(".go", [System.StringComparison]::OrdinalIgnoreCase) -and (Test-Path -LiteralPath $_) } |
              ForEach-Object { Get-Item -LiteralPath $_ }
          )
          if ($goSourceFiles) {
            $formatRoot = Join-Path $PWD ".build\gofmt-check"
            if (Test-Path -LiteralPath $formatRoot) {
              Remove-Item -LiteralPath $formatRoot -Recurse -Force
            }
            $goSources = @()
            $carriageReturn = [string][char]13
            $lineFeed = [string][char]10
            foreach ($goSource in $goSourceFiles) {
              $relativePath = [System.IO.Path]::GetRelativePath($PWD.Path, $goSource.FullName)
              $normalizedPath = Join-Path $formatRoot $relativePath
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $normalizedPath) | Out-Null
              $sourceText = [System.IO.File]::ReadAllText($goSource.FullName)
              $sourceText = $sourceText.Replace($carriageReturn + $lineFeed, $lineFeed).Replace($carriageReturn, $lineFeed)
              [System.IO.File]::WriteAllText($normalizedPath, $sourceText, [System.Text.UTF8Encoding]::new($false))
              $goSources += $normalizedPath
            }
            $unformattedGo = @(gofmt -l $goSources)
            $gofmtExitCode = $LASTEXITCODE
            if ($gofmtExitCode -ne 0) {
              Write-Output "gofmt execution failed with exit code $gofmtExitCode."
              exit $gofmtExitCode
            }
            if ($unformattedGo) {
              Write-Error "gofmt required files: $($unformattedGo -join ', ')"
              exit 1
            }
          } else {
            Write-Output "No changed Go source files; skipping gofmt."
          }
          & ".\.venv\Scripts\python.exe" -m ruff format --check tools\go_cli_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows EXEをbuild
        shell: cmd
        run: call build_exe.bat


      - name: 配布EXEのhelpとversionをsmoke test
        timeout-minutes: 3
        shell: pwsh
        run: |
          $exe = ".\.build\dist\tomiya-code-atlas.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Go版のEXEが見つかりません: $exe"
            exit 1
          }
          $version = & $exe --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch "Tomiya Code Atlas \(Go\)") {
            Write-Error "Go版のEXEのversion smoke testに失敗しました: $version"
            exit 1
          }
          $help = & $exe --help
          $helpText = $help -join "`n"
          if ($LASTEXITCODE -ne 0 -or $helpText -notmatch "使用方法:") {
            Write-Error "Go版のEXEのhelp smoke testに失敗しました: $help"
            exit 1
          }

      - name: 配布Java runtimeをsmoke test
        timeout-minutes: 3
        shell: pwsh
        run: |
          $java = ".\.build\dist\backends\java\runtime\bin\java.exe"
          if (-not (Test-Path $java)) {
            Get-ChildItem ".\.build\dist\backends\java" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            Write-Error "Bundled Java runtime executable is missing: $java"
            exit 1
          }
          & $java -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Python parser helperをsmoke test
        timeout-minutes: 5
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe scripts\build\smoke_python_backend.py ".build\dist\backends\tomiya-python-backend\tomiya-python-backend.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: C# parser helperをsmoke test
        timeout-minutes: 5
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe tools\csharp_backend_smoke.py ".build\dist\backends\csharp\tomiya-csharp-backend.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: C++ parser helperをsmoke test
        timeout-minutes: 5
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe tools\cpp_backend_smoke.py ".build\dist\backends\cpp\tomiya-cpp-backend\tomiya-cpp-backend.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Java parser helperをsmoke test
        timeout-minutes: 5
        shell: pwsh
        run: |
          $java = ".\.build\dist\backends\java\runtime\bin\java.exe"
          & .\.venv\Scripts\python.exe tools\java_backend_smoke.py $java -jar ".build\dist\backends\java\tomiya-java-backend.jar"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Go parser helperをsmoke test
        timeout-minutes: 5
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe tools\go_backend_smoke.py ".build\dist\backends\go\tomiya-go-backend.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Go CLIの配布解析をsmoke test
        timeout-minutes: 5
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe tools\go_cli_smoke.py ".build\dist\tomiya-code-atlas.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Go GUIの配布起動をsmoke test
        timeout-minutes: 3
        shell: pwsh
        run: |
          $exe = ".\.build\dist\tomiya-code-atlas.exe"
          & $exe --gui-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Go版Windows EXEをartifactとして保存
        uses: actions/upload-artifact@v7
        with:
          name: tomiya-code-atlas-go-windows-x64
          path: |
            .build/dist/tomiya-code-atlas.exe
            .build/dist/backends/manifest.json
            .build/dist/backends/tomiya-python-backend/
            .build/dist/backends/csharp/
            .build/dist/backends/cpp/
            .build/dist/backends/java/
            .build/dist/backends/go/
          if-no-files-found: error

