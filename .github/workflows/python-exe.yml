name: Python EXE

on:
  pull_request:
    paths:
      - "app.py"
      - "Src/**"
      - "config/**"
      - "backends/**"
      - "backend-src/**"
      - "pyproject.toml"
      - "README.md"
      - "scripts/build/**"
      - "build_exe.bat"
      - "run_dist.bat"
      - "tools/verify_distribution.py"
      - "scripts/dev/pull_request.bat"
      - "scripts/dev/**"
      - "tests/**"
      - ".github/workflows/python-exe.yml"
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: ソースを取得
        uses: actions/checkout@v7

      - name: Pythonを準備
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: .NET SDKを準備
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: JDKを準備
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: projectとbuild用ツールをinstall
        shell: cmd
        run: |
          call scripts\build\setup.bat

      - name: build入口から配布物を作成・検証
        shell: cmd
        run: call scripts\build\verify.bat

      - name: 配布アプリのsmoke test
        shell: pwsh
        run: |
          $exe = ".\.build\dist\tomiya-code-atlas\tomiya-code-atlas.exe"
          $config = ".\.build\dist\tomiya-code-atlas\config\tomiya-code-atlas.json"
          $backendManifest = ".\.build\dist\tomiya-code-atlas\backends\manifest.json"
          $csharpBackend = ".\.build\dist\tomiya-code-atlas\backends\csharp\tomiya-csharp-backend.exe"
          $javaBackend = ".\.build\dist\tomiya-code-atlas\backends\java\tomiya-java-backend.jar"
          $javaRuntime = ".\.build\dist\tomiya-code-atlas\backends\java\runtime\bin\java.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "EXEが見つかりません: $exe"
            exit 1
          }
          if (-not (Test-Path $config)) {
            Write-Error "実行時configが見つかりません: $config"
            exit 1
          }
          if (-not (Test-Path $backendManifest)) {
            Write-Error "backend manifestが見つかりません: $backendManifest"
            exit 1
          }
          if (-not (Test-Path $csharpBackend)) {
            Write-Error "C# backendが見つかりません: $csharpBackend"
            exit 1
          }
          if (-not (Test-Path $javaBackend)) {
            Write-Error "Java backendが見つかりません: $javaBackend"
            exit 1
          }
          if (-not (Test-Path $javaRuntime)) {
            Write-Error "同梱Java runtimeが見つかりません: $javaRuntime"
            exit 1
          }
          $manifest = Get-Content $backendManifest -Raw | ConvertFrom-Json
          if ($manifest.manifest_version -ne "1") {
            Write-Error "backend manifestのversionが想定外です: $($manifest.manifest_version)"
            exit 1
          }
          if ($manifest.parser_backend_contract_version -ne "1") {
            Write-Error "parser backend contractのversionが想定外です: $($manifest.parser_backend_contract_version)"
            exit 1
          }
          $output = & $exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output -notmatch "Tomiya Code Atlas") {
            Write-Error "EXEの出力が想定外です: $output"
            exit 1
          }
          $backendOutput = & $exe backend-smoke gdscript
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($backendOutput -notmatch "gdscript-tree-sitter") {
            Write-Error "GDScript backend smoke testに失敗しました: $backendOutput"
            exit 1
          }
          $csharpOutput = & $exe backend-smoke csharp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($csharpOutput -notmatch "csharp-roslyn-helper") {
            Write-Error "C# backend smoke testに失敗しました: $csharpOutput"
            exit 1
          }
          $javaOutput = & $exe backend-smoke java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($javaOutput -notmatch "java-javaparser-symbol-solver-helper") {
            Write-Error "Java backend smoke testに失敗しました: $javaOutput"
            exit 1
          }

      - name: Windows配布アプリをartifactとして保存
        uses: actions/upload-artifact@v7
        with:
          name: tomiya-code-atlas-windows-x64
          path: .build/dist/tomiya-code-atlas/**
          if-no-files-found: error
