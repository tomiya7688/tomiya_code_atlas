name: Python EXE

on:
  pull_request:
    paths:
      - "app.py"
      - "Src/**"
      - "config/**"
      - "backends/**"
      - "backend-src/**"
      - "pyproject.toml"
      - "README.md"
      - "scripts/build/**"
      - "build_exe.bat"
      - "run_dist.bat"
      - "tools/verify_distribution.py"
      - "scripts/dev/pull_request.bat"
      - "scripts/dev/**"
      - "tests/**"
      - ".github/workflows/python-exe.yml"
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install project and build tools
        shell: cmd
        run: |
          call scripts\build\setup.bat

      - name: Build and verify from the documented entry points
        shell: cmd
        run: call scripts\build\verify.bat

      - name: Smoke test app
        shell: powershell
        run: |
          $exe = ".\.build\dist\tomiya-code-atlas\tomiya-code-atlas.exe"
          $config = ".\.build\dist\tomiya-code-atlas\config\tomiya-code-atlas.json"
          $backendManifest = ".\.build\dist\tomiya-code-atlas\backends\manifest.json"
          $csharpBackend = ".\.build\dist\tomiya-code-atlas\backends\csharp\tomiya-csharp-backend.exe"
          $javaBackend = ".\.build\dist\tomiya-code-atlas\backends\java\tomiya-java-backend.jar"
          $javaRuntime = ".\.build\dist\tomiya-code-atlas\backends\java\runtime\bin\java.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "EXE not found: $exe"
            exit 1
          }
          if (-not (Test-Path $config)) {
            Write-Error "Runtime config not found: $config"
            exit 1
          }
          if (-not (Test-Path $backendManifest)) {
            Write-Error "Backend manifest not found: $backendManifest"
            exit 1
          }
          if (-not (Test-Path $csharpBackend)) {
            Write-Error "C# backend not found: $csharpBackend"
            exit 1
          }
          if (-not (Test-Path $javaBackend)) {
            Write-Error "Java backend not found: $javaBackend"
            exit 1
          }
          if (-not (Test-Path $javaRuntime)) {
            Write-Error "Private Java runtime not found: $javaRuntime"
            exit 1
          }
          $manifest = Get-Content $backendManifest -Raw | ConvertFrom-Json
          if ($manifest.manifest_version -ne "1") {
            Write-Error "Unexpected backend manifest version: $($manifest.manifest_version)"
            exit 1
          }
          if ($manifest.parser_backend_contract_version -ne "1") {
            Write-Error "Unexpected parser backend contract version: $($manifest.parser_backend_contract_version)"
            exit 1
          }
          $output = & $exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($output -notmatch "Tomiya Code Atlas") {
            Write-Error "Unexpected EXE output: $output"
            exit 1
          }
          $backendOutput = & $exe backend-smoke gdscript
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($backendOutput -notmatch "gdscript-tree-sitter") {
            Write-Error "GDScript backend smoke failed: $backendOutput"
            exit 1
          }
          $csharpOutput = & $exe backend-smoke csharp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($csharpOutput -notmatch "csharp-roslyn-helper") {
            Write-Error "C# backend smoke failed: $csharpOutput"
            exit 1
          }
          $javaOutput = & $exe backend-smoke java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($javaOutput -notmatch "java-javaparser-symbol-solver-helper") {
            Write-Error "Java backend smoke failed: $javaOutput"
            exit 1
          }

      - name: Upload Windows app directory
        uses: actions/upload-artifact@v7
        with:
          name: tomiya-code-atlas-windows-x64
          path: .build/dist/tomiya-code-atlas/**
          if-no-files-found: error
